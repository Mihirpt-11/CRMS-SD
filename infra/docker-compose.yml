    container_name: request-service-3
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "8012:8000"
    networks:
    - crms


  graphql-gateway-1:
    build: ../services/graphql-gateway
    container_name: graphql-gateway-1
    environment:
      BOOKING_URL: http://booking-service-1:8000
      HOSTEL_URL: http://hostel-service-1:8000
      REQUEST_URL: http://request-service-1:8000
      AUTH_URL: http://auth-service-1:8000
      REDIS_URL: redis://redis:6379/0
  
    depends_on:
      - booking-service-1
      - hostel-service-1
      - request-service-1
      - auth-service-1
    ports:
      - "8081:8080"
    networks:
    - crms

  graphql-gateway-2:
