services:

  # ---------------------------------------------------
  # DATABASES & MESSAGE QUEUE
  # ---------------------------------------------------

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
    - crms

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
    - crms

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
    - crms

  # ---------------------------------------------------
  # API GATEWAY (NGINX)
  # ---------------------------------------------------

  nginx:
    image: nginx:stable
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service-1
      - booking-service-1
      - hostel-service-1
      - request-service-1
      - graphql-gateway-1
    networks:
    - crms

  # ---------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------

  frontend:
    build: ../services/frontend
    container_name: frontend
    # environment:
    # - VITE_API_BASE_URL=/
    ports:
      - "3000:80"
    networks:
    - crms

  # ---------------------------------------------------
  # MICROSERVICES
  # ---------------------------------------------------

  # auth-service:
  #   build: ../services/auth
  #   container_name: auth-service
  #   environment:
  #     MONGODB_URL: mongodb://mongodb:27017/campus
  #     SECRET_KEY: supersecret
  #   depends_on:
  #     - mongodb
  #   ports:
  #     - "8001:8000"
  auth-service-1:
    build: ../services/auth
    container_name: auth-service-1
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
    ports:
      - "8001:8000"
    networks:
    - crms

  auth-service-2:
    build: ../services/auth
    container_name: auth-service-2
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
    ports:
      - "8002:8000"
    networks:
    - crms

  auth-service-3:
    build: ../services/auth
    container_name: auth-service-3
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
    ports:
      - "8005:8000"
    networks:
    - crms

  booking-service-1:
    build: ../services/booking
    container_name: booking-service-1
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    ports:
      - "8006:8000"
    networks:
    - crms

  booking-service-2:
    build: ../services/booking
    container_name: booking-service-2
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    ports:
      - "8007:8000"
    networks:
    - crms

  booking-service-3:
    build: ../services/booking
    container_name: booking-service-3
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    ports:
      - "8008:8000"
    networks:
    - crms


  hostel-service-1:
    build: ../services/hostel
    container_name: hostel-service-1
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "8003:8000"
    networks:
    - crms

  hostel-service-2:
    build: ../services/hostel
    container_name: hostel-service-2
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "8009:8000"
    networks:
    - crms

  hostel-service-3:
    build: ../services/hostel
    container_name: hostel-service-3
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
