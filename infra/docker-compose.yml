    ports:
      - "8010:8000"
    networks:
    - crms


  request-service-1:
    build: ../services/request
    container_name: request-service-1
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
    depends_on:
      - mongodb
      - rabbitmq
    ports:
      - "8004:8000"
    networks:
    - crms

  request-service-2:
    build: ../services/request
    container_name: request-service-2
    environment:
      MONGODB_URL: mongodb://mongodb:27017/campus
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SECRET_KEY: supersecret
