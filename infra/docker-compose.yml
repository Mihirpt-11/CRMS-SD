      - hostel-service-3
      - request-service-3
      - auth-service-3
    ports:
      - "8083:8080"
    networks:
    - crms


  notification-service:
    build: ../services/notification
    container_name: notification-service
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    networks:
    - crms

volumes:
  mongo_data:

networks:
  crms:
    driver: bridge
